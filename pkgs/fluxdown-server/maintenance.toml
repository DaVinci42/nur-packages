files = ["default.nix", "settings-schema.json"]
rawSource = "default.nix"
sync = ["python3", "pkgs/fluxdown-server/update-settings.py"]
contract = ["python3", "pkgs/fluxdown-server/update-settings.py", "--check"]
tests = [
  ["nix-instantiate", "--eval", "--strict", "--expr", "import ./tests/eval.nix {}"],
  ["python3", "tests/settings.py", "-v"],
]
runtimePackageEnv = "FLUXDOWN_TEST_PACKAGE"
